spring:
  server:
    port: 8080

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

swagger:
  auth:
    username: ${SWAGGER_AUTH_USERNAME}
    password: ${SWAGGER_AUTH_PASSWORD}