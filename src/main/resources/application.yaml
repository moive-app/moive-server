spring:
  application:
    name: MoiveBE
  profiles:
    include: local

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

kakao:
  transit:
    api-key: ${KAKAO_TRANSIT_API_KEY}

app:
  invite:
    base-url: https://moiveserver.store/invite

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}