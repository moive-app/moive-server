spring:
  application:
    name: MoiveBE
  profiles:
    include: local

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

kakao:
  transit:
    api-key: ${KAKAO_TRANSIT_API_KEY}

app:
  invite:
    base-url: https://moiveserver.store/invite

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-5-mini

place-vote:
  deadline-days: ${PLACE_VOTE_DEADLINE_DAYS:1}

meeting:
  daily-batch-cron: ${MEETING_DAILY_BATCH_CRON:0 0 0 * * *} # 매일 자정 (장소 투표 마감 + 일정 경과 모임 종료 처리)